<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mohdsyahid's Contribution Snake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e272e 0%, #0f1419 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: glow 3s infinite;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(30, 168, 91, 0.5); }
            50% { text-shadow: 0 0 20px rgba(30, 168, 91, 0.8), 0 0 30px rgba(48, 233, 140, 0.6); }
        }
        
        .subtitle {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        .snake-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        svg {
            width: 100%;
            height: auto;
            max-height: 400px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1ea85b 0%, #218f39 100%);
            padding: 20px;
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(30, 168, 91, 0.4);
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: #aaa;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        
        footer {
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
        }
        
        footer a {
            color: #1ea85b;
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 mohdsyahid's Contribution Activity</h1>
        <p class="subtitle">An animated snake showing my GitHub contributions over time</p>
        
        <div class="snake-container">
            <!-- Include your snake.svg here -->
            <img src="snake.svg" alt="Contribution Snake" style="width: 100%;">
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #ff767a;"></div>
                <span>Low activity</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #4af5ac;"></div>
                <span>Moderate activity</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #1ea85b;"></div>
                <span>High activity</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #218f39;"></div>
                <span>V很高的活动</span>
            </div>
        </div>
        
        <footer>
            <p>View on GitHub: <a href="https://github.com/mohdsyahid" target="_blank">@mohdsyahid</a></p>
            <p style="margin-top: 10px;">Generated with 💚 for Open Source</p>
        </footer>
    </div>
    
    <script>
        // Add interactive hover effects
        document.addEventListener('DOMContentLoaded', function() {
            const cells = document.querySelectorAll('.snake-cell');
            
            cells.forEach(cell => {
                cell.addEventListener('mouseenter', function() {
                    this.style.animationDuration = '0.5s';
                });
                
                cell.addEventListener('mouseleave', function() {
                    this.style.animationDuration = '3s';
                });
            });
            
            console.log('🐍 Contribution Snake loaded successfully!');
        });
    </script>
</body>
</html>
